<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Before and after: unsafe POST retries fixed by HttpClient.Resilience.Analyzers HCR041</title>
  <desc id="desc">Side-by-side before/after showing AddStandardResilienceHandler retrying POST versus DisableForUnsafeHttpMethods after the HCR041 code fix.</desc>
  <rect width="920" height="480" rx="12" fill="#0f172a"/>
  <text x="32" y="40" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Code fix: unsafe method retries (HCR041)</text>
  <text x="32" y="64" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Catch non-idempotent POST through AddStandardResilienceHandler before production</text>

  <rect x="24" y="88" width="430" height="360" rx="10" fill="#1e1b1b" stroke="#7f1d1d" stroke-width="1.5"/>
  <rect x="24" y="88" width="430" height="40" rx="10" fill="#7f1d1d"/>
  <rect x="24" y="118" width="430" height="10" fill="#7f1d1d"/>
  <text x="40" y="114" fill="#fecaca" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">BEFORE — retries unsafe POST</text>

  <text x="40" y="156" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">// DI registration</text>
  <text x="40" y="180" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">services.AddHttpClient&lt;PaymentsClient&gt;()</text>
  <text x="40" y="200" fill="#f87171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">  .AddStandardResilienceHandler();</text>

  <text x="40" y="236" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">// typed client</text>
  <text x="40" y="260" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">httpClient.PostAsync("/payments", …)</text>
  <text x="40" y="280" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">// POST is not idempotent by default</text>

  <rect x="40" y="320" width="398" height="100" rx="6" fill="#450a0a"/>
  <text x="52" y="348" fill="#fecaca" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">⚠ HCR041 warning</text>
  <text x="52" y="370" fill="#fca5a5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Standard resilience retries unsafe HTTP</text>
  <text x="52" y="390" fill="#fca5a5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">methods (POST/PUT/PATCH/DELETE/…)</text>

  <rect x="466" y="88" width="430" height="360" rx="10" fill="#0f1f17" stroke="#14532d" stroke-width="1.5"/>
  <rect x="466" y="88" width="430" height="40" rx="10" fill="#14532d"/>
  <rect x="466" y="118" width="430" height="10" fill="#14532d"/>
  <text x="482" y="114" fill="#bbf7d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">AFTER — code fix applied</text>

  <text x="482" y="156" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">// DI registration</text>
  <text x="482" y="180" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">services.AddHttpClient&lt;PaymentsClient&gt;()</text>
  <text x="482" y="200" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">  .AddStandardResilienceHandler(o =&gt;</text>
  <text x="482" y="220" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">  {</text>
  <text x="482" y="240" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">    o.Retry.DisableForUnsafeHttpMethods();</text>
  <text x="482" y="260" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">  });</text>

  <text x="482" y="296" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">// POST no longer auto-retried</text>
  <text x="482" y="320" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">httpClient.PostAsync("/payments", …)</text>

  <rect x="482" y="356" width="398" height="64" rx="6" fill="#052e16"/>
  <text x="494" y="382" fill="#bbf7d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">✓ Unsafe methods excluded from retry</text>
  <text x="494" y="402" fill="#86efac" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Idempotent ops can still opt into retries</text>
</svg>
